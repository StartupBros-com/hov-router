name: Prepare HoV Router Artifacts

on:
  pull_request:
    # edited: re-run the squash-commit check when the title or description changes.
    types: [opened, synchronize, reopened, edited]
  # main itself: branch protection no longer requires a PR to be up to date with main
  # before it merges, so this run checks the merged result. The squash-commit step
  # passes on a push (no pull request in the event).
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
          token: ''

      - name: Verify the installed Bun matches .bun-version
        # setup-bun otherwise falls back to latest when the file is missing.
        run: test "$(bun --version)" = "$(tr -d '[:space:]' < .bun-version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that release-please can parse the squash commit
        # release-please drops a commit it cannot parse without failing (#797).
        run: bun run scripts/check-squash-commit-parse.ts "$GITHUB_EVENT_PATH"

      - name: Prepare and verify unpublished Linux artifacts
        run: |
          printf '%s\n' 'Local ephemeral preparation only; not release publication. No artifacts are uploaded or retained.'
          preparation_root="$(mktemp -d "$RUNNER_TEMP/hov-router.XXXXXX")"
          bun run apps/cli/prepare-router-artifacts.ts "$preparation_root/artifacts"
