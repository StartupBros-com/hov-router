# Weekly GitHub Actions version updates. Package updates come from the fleet's
# Renovate run, configured in renovate.json, as in the rest of the fleet (#910).
# Security updates are enabled separately in the repository settings and are not
# affected by this file.
#
# Squash commits must parse for the required `prepare` check (#797). The `chore`
# prefix keeps each title parseable and out of the release notes. Dependabot's
# description quotes upstream release notes, and code in them can still fail the
# parser (5 of 30 sampled public Dependabot pull requests). When `prepare` fails on
# one, add an override block to the description, as described in
# docs/hov-router-releases.md, "Squash commits release-please can parse".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        # Its exact SHA is asserted on purpose (router-release-workflow.test.ts), so
        # it gets its own PR and its expected failure blocks no other bump.
        exclude-patterns: ["actions/create-github-app-token"]
        update-types: [minor, patch]
