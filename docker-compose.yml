# Builds HoV Router from this checkout; no prebuilt image is published.
#   docker compose up -d --build
services:
  # Compose names the real volume <project>_hov-router-data, and the project
  # defaults to this directory's name. The backup commands in docs/docker.md
  # rely on the fixed container name. An install from before 8.0.0 used
  # better-ccflare names; docs/docker.md covers moving its data.
  hov-router:
    build: .
    image: hov-router:local
    container_name: hov-router
    restart: unless-stopped
    # On stop the server finishes in-flight responses for up to 60 s
    # (HOV_ROUTER_SHUTDOWN_DRAIN_MS) plus 15 s of cleanup. Docker's default 10 s
    # kills it mid-response; raise this if you raise the drain.
    stop_grace_period: 90s
    ports:
      # The image sets HOV_ROUTER_HOST=0.0.0.0 so this published port
      # works; do not override it here or in .env for the container. To keep
      # the router off your network, publish on loopback instead:
      #   - "127.0.0.1:8080:8080"
      - "8080:8080"
    volumes:
      # Persist database
      - hov-router-data:/data
      # Optional: mount custom config
      # - ./config:/app/config:ro
    environment:
      - NODE_ENV=production
      - HOV_ROUTER_DB_PATH=/data/hov-router.db
      - XDG_CONFIG_HOME=/data
      # Optional: configure logging
      # - LOG_LEVEL=info
      # Optional: expose per-account detail on /health?detail=1 (default: off)
      # - HEALTH_DETAIL_ENABLED=false
    # Optional .env file next to this compose file; compose starts without it.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust as needed). Set the memory limit above the router's
    # measured peak; the reservation is the container's memory.low, which protects
    # nothing unless its parent slice also sets MemoryLow. See docs/docker.md#memory.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  hov-router-data:
    driver: local
